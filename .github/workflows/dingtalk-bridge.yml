name: DingTalk Bridge
on:
  push:
    paths:
      - 'plugins/alma-dingtalk-bridge/**'
      - '.github/workflows/dingtalk-bridge.yml'
      - 'scripts/lint-versions.mjs'
      - 'registry.json'
  pull_request:
    paths:
      - 'plugins/alma-dingtalk-bridge/**'
      - '.github/workflows/dingtalk-bridge.yml'
      - 'scripts/lint-versions.mjs'
      - 'registry.json'
permissions:
  contents: read
concurrency:
  group: dingtalk-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugins/alma-dingtalk-bridge
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - name: Check registry versions
        working-directory: .
        run: node scripts/lint-versions.mjs
      - name: Restore exact locked dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Type check
        run: bun run typecheck
      - name: Offline unit and integration tests
        run: bun run test:offline
      - name: Compare committed bundle to source
        run: bun run check:bundle
